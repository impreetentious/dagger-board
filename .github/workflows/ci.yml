name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the job only reads the checkout, it never writes back.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # This consults the live advisory database, so it can turn red without a
      # code change. Both runtime and build/test dependencies are release inputs.
      - run: npm audit --audit-level=high
      - run: npm run check:version
      - run: npm run fixtures:check
      - run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      # Every § citation in source must resolve in docs/MATH-SPEC.md.
      - run: npm run check:citations
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      # Runs after the build so it can scan the real export, not just the configs.
      - run: npm run check:csp
      - run: npm run bundle:check
      - run: npm run test:e2e

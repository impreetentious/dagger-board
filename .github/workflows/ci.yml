name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the job only reads the checkout, it never writes back.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # This consults the live advisory database, so it can turn red without a
      # code change. Both runtime and build/test dependencies are release inputs.
      - run: npm audit --audit-level=high
      - run: npm run check:version
      - run: npm run fixtures:check
      - run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      # Every § citation in source must resolve in docs/MATH-SPEC.md.
      - run: npm run check:citations
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      # Runs after the build so it can scan the real export, not just the configs.
      - run: npm run check:csp
      - run: npm run bundle:check
      - run: npm run test:e2e
